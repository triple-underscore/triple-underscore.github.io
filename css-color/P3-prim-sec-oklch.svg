<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="-68.08 -36.99 136 108"
	width="700" height="557"
	overflow="visible"
>
<desc>
OKLab 色空間の L 軸方向からの俯瞰を示す。
display-p3 の原色と二次色が示され，それぞれには OKLCH L, C, H 値を与える凡例を伴う。
比較用に， sRGB の原色と二次色も示されている（破線）。
—
Show a top-down view of the OKLab color space.
The display-p3 primaries and secondaries are shown,
with a legend giving the OKLCH L, C and H values.
For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>

<style type="text/css"><![CDATA[
:root {
	color-scheme: light dark;
	background: Canvas;
	--grey: light-dark( grey, silver );
	font-family: monospace;
}

text {
	fill: CanvasText;
	stroke: none;
}

path {
	fill: none;
	stroke: CanvasText;
	stroke-width: 0.3;
}

.tic {
	stroke: var(--grey);
}
]]></style>

<defs>
<circle
	id="color-spot"
	r="1.3"
	stroke="CanvasText"
	stroke-width="0.3"
/>
</defs>

<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->

<rect x="-68.08" y="-36.99" width="100%" height="100%" fill="Canvas" />

<!-- axes -->
<path d="M0 -28.99 0 38.14"/>
<path d="M-36.42 0 37.64 0"/>
<!-- tic marks -->
<path class="tic" d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3"/>
<path class="tic" d="M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3"/>
<g stroke="#888">
</g>

<!-- sRGB primaries and secondaries -->
	<g opacity="0.5">
		<g stroke-dasharray="0.6 1.2">
<!-- radial lines for sRGB hue angle and chroma -->
<path d="M0,0 22.4863,-12.5846"/>
<path d="M0,0 -23.3888,-17.9498"/>
<path d="M0,0 -3.2457,31.1528"/>
<path d="M0,0 -14.9444,3.9398"/>
<path d="M0,0 27.4566,16.9156"/>
<path d="M0,0 -7.1369,-19.8570"/>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(22.4863, -12.5846)"/>
<use href="#color-spot" fill="green"
	transform="translate(-23.3888, -17.9498)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.2457, 31.1528)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-14.9444, 3.9398)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(27.4566, 16.9156)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.1369, -19.8570)"/>
	</g>

<!-- display-p3 primaries and secondaries -->
	<g>
<!-- radial lines for display-p3 hue angle and chroma -->
<path d="M0,0 26.2042,-14.5002"/>
<path d="M0,0 -30.4241,-20.7967"/>
<path d="M0,0 -3.3487,32.1416"/>
<path d="M0,0 -20.0284,4.6747"/>
<path d="M0,0 31.6423,17.2058"/>
<path d="M0,0 -8.4729,-22.9916"/>

<!-- the fill colors are sRGB, *not the display-p3 colors* -->
<use href="#color-spot" fill="red"
	transform="translate(26.2042, -14.5002)"/>
<use href="#color-spot" fill="green"
	transform="translate(-30.4241, -20.7967)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.3487, 32.1416)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-20.0284, 4.6747)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(31.6423, 17.2058)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-8.4729, -22.9916)"/>
	</g>


<use href="#color-spot" fill="Canvas" />

	<g font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
<text x="39.64" y="1">+a</text>
<text x="-38.42" y="1" text-anchor="end">-a</text>
<text x="2" y="43.14">-b</text>
<text x="2" y="-31.99">+b</text>
	</g>

	<g font-size="2.4pt">
		<g font-weight="bold">
<text x="-39.04" y="48.14">L</text>
<text x="-27.11" y="48.14">C</text>
<text x="-13.69" y="48.14">H</text>
<text x="24.82" y="48.14">L</text>
<text x="36.75" y="48.14">C</text>
<text x="50.17" y="48.14">H</text>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(-61, 52.1)"/>
<text x="-56.92" y="52.94">red</text>
<text x="-39.04" y="52.94">64.86%</text>
<text x="-27.11" y="52.94">0.29949</text>
<text x="-13.69" y="52.94">28.96</text>
<use href="#color-spot" fill="cyan"
	transform="translate(7.32, 52.1)"/>
<text x="11.4" y="52.94">cyan</text>
<text x="24.82" y="52.94">89.29%</text>
<text x="36.75" y="52.94">0.20567</text>
<text x="50.17" y="52.94">193.14</text>
<use href="#color-spot" fill="green"
	transform="translate(-61, 56.9)"/>
<text x="-56.92" y="57.74">green</text>
<text x="-39.04" y="57.74">84.88%</text>
<text x="-27.11" y="57.74">0.36853</text>
<text x="-13.69" y="57.74">145.64</text>
<use href="#color-spot" fill="magenta"
	transform="translate(7.32, 56.9)"/>
<text x="11.4" y="57.74">magenta</text>
<text x="24.82" y="57.74">72.50%</text>
<text x="36.75" y="57.74">0.36018</text>
<text x="50.17" y="57.74">331.46</text>
<use href="#color-spot" fill="blue"
	transform="translate(-61, 61.7)"/>
<text x="-56.92" y="62.54">blue</text>
<text x="-39.04" y="62.54">46.64%</text>
<text x="-27.11" y="62.54">0.32316</text>
<text x="-13.69" y="62.54">264.05</text>
<use href="#color-spot" fill="yellow"
	transform="translate(7.32, 61.7)"/>
<text x="11.4" y="62.54">yellow</text>
<text x="24.82" y="62.54">96.48%</text>
<text x="36.75" y="62.54">0.24503</text>
<text x="50.17" y="62.54">110.23</text>
</g>
</svg>
