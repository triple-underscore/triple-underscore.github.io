<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="-65.85 -37.8 132 112"
	width="700" height="594"
	overflow="visible"
>
<desc>
OKLab 色空間の L 軸方向からの俯瞰を示す。
rec2020 の原色と二次色が示され，それぞれには OKLCH L, C, H 値を与える凡例を伴う。
比較用に， sRGB の原色と二次色も示されている（破線）。
—
Show a top-down view of the OKLab color space.
The rec2020 primaries and secondaries are shown,
with a legend giving the OKLCH L, C and H values.
For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>

<style type="text/css"><![CDATA[
:root {
	color-scheme: light dark;
	background: Canvas;
	--grey: light-dark( grey, silver );
	font-family: monospace;
}

text {
	fill: CanvasText;
	stroke: none;
}

path {
	fill: none;
	stroke: CanvasText;
	stroke-width: 0.3;
}

.tic {
	stroke: var(--grey);
}
]]></style>

<defs>
<circle
	id="color-spot"
	r="1.3"
	stroke="CanvasText"
	stroke-width="0.3"
/>
</defs>

<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->

<rect x="-65.85" y="-37.8" width="100%" height="100%" fill="Canvas" />

<!-- axes -->
<path d="M0 -29.8 v71"/>
<path d="M-47.58 0 h92"/>
<!-- tic marks -->
<path class="tic" d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3 M-1.5,40 h3"/>
<path class="tic" d="M-40,-1.5 v3 M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3 M40,-1.5 v3"/>

<!-- sRGB primaries and secondaries -->
	<g opacity="0.5">
		<g stroke-dasharray="0.6 1.2">
<!-- radial lines for sRGB hue angle and chroma -->
<path d="M0,0 22.4863,-12.5846"/>
<path d="M0,0 -23.3888,-17.9498"/>
<path d="M0,0 -3.2457,31.1528"/>
<path d="M0,0 -14.9444,3.9398"/>
<path d="M0,0 27.4566,16.9156"/>
<path d="M0,0 -7.1369,-19.8570"/>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(22.4863, -12.5846)"/>
<use href="#color-spot" fill="green"
	transform="translate(-23.3888, -17.9498)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.2457, 31.1528)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-14.9444, 3.9398)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(27.4566, 16.9156)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.1369, -19.8570)"/>
	</g>

<!-- rec2020 primaries and secondaries -->
	<g>
<!-- radial lines for rec2020 hue angle and chroma -->
<path d="M0,0 33.2730,-14.9438"/>
<path d="M0,0 -41.5774,-21.5562"/>
<path d="M0,0 -16.1378,34.7132"/>
<path d="M0,0 -31.9793,5.5543"/>
<path d="M0,0 38.7745,16.8179"/>
<path d="M0,0 -7.9959,-23.7978"/>

<!-- the fill colors are sRGB, *not the rec2020 colors* -->
<use href="#color-spot" fill="red"
	transform="translate(33.2730, -14.9438)"/>
<use href="#color-spot" fill="green"
	transform="translate(-41.5774, -21.5562)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-16.1378, 34.7132)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-31.9793, 5.5543)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(38.7745, 16.8179)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.9959, -23.7978)"/>
	</g>

<use href="#color-spot" fill="Canvas" />

	<g font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
<text x="46.77" y="1">+a</text>
<text x="-49.58" y="1" text-anchor="end">-a</text>
<text x="2" y="45.71">-b</text>
<text x="2" y="-32.8">+b</text>
	</g>

	<g font-size="2.4pt">
		<g font-weight="bold">
<text x="-41.27" y="50.71">L</text>
<text x="-29.34" y="50.71">C</text>
<text x="-15.92" y="50.71">H</text>
<text x="22.59" y="50.71">L</text>
<text x="34.52" y="50.71">C</text>
<text x="47.94" y="50.71">H</text>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(-58.77, 54.67)"/>
<text x="-54.69" y="55.51">red</text>
<text x="-41.27" y="55.51">68.71%</text>
<text x="-29.34" y="55.51">0.36475</text>
<text x="-15.92" y="55.51">24.19</text>
<use href="#color-spot" fill="cyan"
	transform="translate(5.09, 54.67)"/>
<text x="9.17" y="55.51">cyan</text>
<text x="22.59" y="55.51">86.51%</text>
<text x="34.52" y="55.51">0.32458</text>
<text x="47.94" y="55.51">189.85</text>
<use href="#color-spot" fill="green"
	transform="translate(-58.77, 59.47)"/>
<text x="-54.69" y="60.31">green</text>
<text x="-41.27" y="60.31">82.98%</text>
<text x="-29.34" y="60.31">0.46833</text>
<text x="-15.92" y="60.31">152.60</text>
<use href="#color-spot" fill="magenta"
	transform="translate(5.09, 59.47)"/>
<text x="9.17" y="60.31">magenta</text>
<text x="22.59" y="60.31">74.43%</text>
<text x="34.52" y="60.31">0.42265</text>
<text x="47.94" y="60.31">336.55</text>
<use href="#color-spot" fill="blue"
	transform="translate(-58.77, 64.27)"/>
<text x="-54.69" y="65.11">blue</text>
<text x="-41.27" y="65.11">42.34%</text>
<text x="-29.34" y="65.11">0.38281</text>
<text x="-15.92" y="65.11">245.07</text>
<use href="#color-spot" fill="yellow"
	transform="translate(5.09, 64.27)"/>
<text x="9.17" y="65.11">yellow</text>
<text x="22.59" y="65.11">97.26%</text>
<text x="34.52" y="65.11">0.25105</text>
<text x="47.94" y="65.11">108.57</text>
	</g>
</svg>
