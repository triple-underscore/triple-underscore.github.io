<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="-152.64 -39.49 222 121"
	width="700" height="382"
	overflow="visible"
>
<desc>
OKLab 色空間の L 軸方向からの俯瞰を示す。
prophoto-rgb の原色と二次色が示され，それぞれには OKLCH L, C, H 値を与える凡例を伴う。
比較用に， sRGB の原色と二次色も示されている（破線）。
—
Show a top-down view of the OKLab color space.
The prophoto-rgb primaries and secondaries are shown,
with a legend giving the OKLCH L, C and H values.
For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>

<style type="text/css"><![CDATA[
:root {
	color-scheme: light dark;
	background: Canvas;
	--grey: light-dark( grey, silver );
	font-family: monospace;
}

text {
	fill: CanvasText;
	stroke: none;
}

path {
	fill: none;
	stroke: CanvasText;
	stroke-width: 0.3;
}

.tic {
	stroke: var(--grey);
}
]]></style>

<defs>
<circle
	id="color-spot"
	r="1.3"
	stroke="CanvasText"
	stroke-width="0.3"
/>
</defs>

<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-152.64" y="-39.49" width="100%" height="100%" fill="Canvas" />

<!-- axes -->
<path d="M0 -31.49 0 48.73"/>
<path d="M-140.64 0 50.97 0"/>

<!-- tic marks -->
<path class="tic" d="M-1.5,-30 h3 M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3 M-1.5,40 h3"/>
<path class="tic" d="M-140,-1.5 v3 M-130,-1.5 v3 M-120,-1.5 v3 M-110,-1.5 v3 M-100,-1.5 v3 M-90,-1.5 v3 M-80,-1.5 v3 M-70,-1.5 v3 M-60,-1.5 v3 M-50,-1.5 v3 M-40,-1.5 v3 M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3 M40,-1.5 v3 M50,-1.5 v3"/>

<!-- sRGB primaries and secondaries -->
	<g opacity="0.5">
		<g stroke-dasharray="0.6 1.2">
<!-- radial lines for sRGB hue angle and chroma -->
<path d="M0,0 22.4863,-12.5846"/>
<path d="M0,0 -23.3888,-17.9498"/>
<path d="M0,0 -3.2457,31.1528"/>
<path d="M0,0 -14.9444,3.9398"/>
<path d="M0,0 27.4566,16.9156"/>
<path d="M0,0 -7.1369,-19.8570"/>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(22.4863, -12.5846)"/>
<use href="#color-spot" fill="green"
	transform="translate(-23.3888, -17.9498)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.2457, 31.1528)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-14.9444, 3.9398)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(27.4566, 16.9156)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.1369, -19.8570)"/>

	</g>


<!-- prophoto-rgb primaries and secondaries -->
<!-- the fill colors are sRGB, *not the prophoto-rgb colors* -->
	<g>
<!-- radial lines for prophoto-rgb hue angle and chroma -->
<path d="M0,0 40.6680,-14.4621"/>
<path d="M0,0 -46.7817,-24.0727"/>
<path d="M0,0 -134.6398,42.7347"/>
<path d="M0,0 -44.7850,5.7496"/>
<path d="M0,0 44.9664,19.0465"/>
<path d="M0,0 -5.8583,-25.4946"/>

<use href="#color-spot" fill="red"
	transform="translate(40.6680, -14.4621)"/>
<use href="#color-spot" fill="green"
	transform="translate(-46.7817, -24.0727)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-134.6398, 42.7347)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-44.7850, 5.7496)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(44.9664, 19.0465)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-5.8583, -25.4946)"/>

	</g>

<use href="#color-spot" fill="Canvas" />

	<g font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
<text x="52.97" y="1">+a</text>
<text x="-142.64" y="1" text-anchor="end">-a</text>
<text x="2" y="53.73">-b</text>
<text x="2" y="-34.489999999999995">+b</text>
	</g>

	<g font-size="2.4pt">
		<g font-weight="bold">
<text x="-37.55" y="58.73">L</text>
<text x="-25.62" y="58.73">C</text>
<text x="-12.2" y="58.73">H</text>
<text x="26.31" y="58.73">L</text>
<text x="38.24" y="58.73">C</text>
<text x="51.66" y="58.73">H</text>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(-62.49, 62.69)"/>
<text x="-58.41" y="63.53">red</text>
<text x="-37.55" y="63.53">70.20%</text>
<text x="-25.62" y="63.53">0.43163</text>
<text x="-12.2" y="63.53">19.58</text>
<use href="#color-spot" fill="cyan"
	transform="translate(8.81, 62.69)"/>
<text x="12.89" y="63.53">cyan</text>
<text x="26.31" y="63.53">84.76%</text>
<text x="38.24" y="63.53">0.45153</text>
<text x="51.66" y="63.53">187.32</text>
<use href="#color-spot" fill="green"
	transform="translate(-62.49, 67.49)"/>
<text x="-58.41" y="68.33">green</text>
<text x="-37.55" y="68.33">84.01%</text>
<text x="-25.62" y="68.33">0.52612</text>
<text x="-12.2" y="68.33">152.77</text>
<use href="#color-spot" fill="magenta"
	transform="translate(8.81, 67.49)"/>
<text x="12.89" y="68.33">magenta</text>
<text x="26.31" y="68.33">72.79%</text>
<text x="38.24" y="68.33">0.48834</text>
<text x="51.66" y="68.33">337.04</text>
<use href="#color-spot" fill="blue"
	transform="translate(-62.49, 72.29)"/>
<text x="-58.41" y="73.13">blue</text>
<text x="-37.55" y="73.13">21.72%</text>
<text x="-25.62" y="73.13">1.41259</text>
<text x="-12.2" y="73.13">197.61</text>
<use href="#color-spot" fill="yellow"
	transform="translate(8.81, 72.29)"/>
<text x="12.89" y="73.13">yellow</text>
<text x="26.31" y="73.13">99.04%</text>
<text x="38.24" y="73.13">0.26159</text>
<text x="51.66" y="73.13">102.94</text>
	</g>
</svg>
