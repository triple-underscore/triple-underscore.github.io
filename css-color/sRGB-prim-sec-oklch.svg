<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="-64.36 -33.86 129 104"
	width="700" height="567"
	overflow="visible"
>
<desc>
OKLab 色空間の L 軸方向からの俯瞰を示す。
prophoto-rgb の原色と二次色が示され，それぞれには OKLCH L, C, H 値を与える凡例を伴う。
—
Show a top-down view of the OKLab color space.
The sRGB primaries and secondaries are shown,
with a legend giving the OKLCH L, C and H values.
</desc>

<style type="text/css"><![CDATA[
:root {
	color-scheme: light dark;
	background: Canvas;
	--grey: light-dark( grey, silver );
	font-family: monospace;
}

text {
	fill: CanvasText;
	stroke: none;
}

path {
	fill: none;
	stroke: CanvasText;
	stroke-width: 0.3;
}

.tic {
	stroke: var(--grey);
}
]]></style>

<defs>
<circle
	id="color-spot"
	r="1.3"
	stroke="CanvasText"
	stroke-width="0.3"
/>
</defs>

<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-64.36" y="-33.86" width="100%" height="100%" fill="Canvas" />

<!-- axes -->
<path d="M0 -25.86 0 37.15"/>
<path d="M-29.39 0 33.46 0"/>

<!-- tic marks -->
<path class="tic" d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3"/>
<path class="tic" d="M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3"/>

<!-- sRGB primaries and secondaries -->
	<g>
<!-- radial lines for sRGB hue angle and chroma -->
<path d="M0,0 22.4863,-12.5846"/>
<path d="M0,0 -23.3888,-17.9498"/>
<path d="M0,0 -3.2457,31.1528"/>
<path d="M0,0 -14.9444,3.9398"/>
<path d="M0,0 27.4566,16.9156"/>
<path d="M0,0 -7.1369,-19.8570"/>

<!-- the fill colors are sRGB, *not the sRGB colors* -->
<use href="#color-spot" fill="red"
	transform="translate(22.4863, -12.5846)"/>
<use href="#color-spot" fill="green"
	transform="translate(-23.3888, -17.9498)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.2457, 31.1528)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-14.9444, 3.9398)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(27.4566, 16.9156)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.1369, -19.8570)"/>
	</g>

<use href="#color-spot" fill="Canvas" />
	<g font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
<text x="35.46" y="1">+a</text>
<text x="-31.39" y="1" text-anchor="end">-a</text>
<text x="2" y="42.15">-b</text>
<text x="2" y="-28.86">+b</text>
	</g>

	<g font-size="2.4pt">
		<g font-weight="bold">
<text x="-42.76" y="47.15">L</text>
<text x="-30.83" y="47.15">C</text>
<text x="-17.41" y="47.15">H</text>
<text x="21.1" y="47.15">L</text>
<text x="33.03" y="47.15">C</text>
<text x="46.45" y="47.15">H</text>
		</g>
<use href="#color-spot" fill="red"
	transform="translate(-57.28, 51.11)"/>
<text x="-53.2" y="51.95">red</text>
<text x="-42.76" y="51.95">62.80%</text>
<text x="-30.83" y="51.95">0.25768</text>
<text x="-17.41" y="51.95">29.23</text>
<use href="#color-spot" fill="cyan"
	transform="translate(3.6, 51.11)"/>
<text x="7.68" y="51.95">cyan</text>
<text x="21.1" y="51.95">90.54%</text>
<text x="33.03" y="51.95">0.15455</text>
<text x="46.45" y="51.95">194.77</text>
<use href="#color-spot" fill="green"
	transform="translate(-57.28, 55.91)"/>
<text x="-53.2" y="56.75">green</text>
<text x="-42.76" y="56.75">86.64%</text>
<text x="-30.83" y="56.75">0.29483</text>
<text x="-17.41" y="56.75">142.50</text>
<use href="#color-spot" fill="magenta"
	transform="translate(3.6, 55.91)"/>
<text x="7.68" y="56.75">magenta</text>
<text x="21.1" y="56.75">70.17%</text>
<text x="33.03" y="56.75">0.32249</text>
<text x="46.45" y="56.75">328.36</text>
<use href="#color-spot" fill="blue"
	transform="translate(-57.28, 60.71)"/>
<text x="-53.2" y="61.55">blue</text>
<text x="-42.76" y="61.55">45.20%</text>
<text x="-30.83" y="61.55">0.31321</text>
<text x="-17.41" y="61.55">264.05</text>
<use href="#color-spot" fill="yellow"
	transform="translate(3.6, 60.71)"/>
<text x="7.68" y="61.55">yellow</text>
<text x="21.1" y="61.55">96.80%</text>
<text x="33.03" y="61.55">0.21101</text>
<text x="46.45" y="61.55">109.77</text>
	</g>
</svg>
