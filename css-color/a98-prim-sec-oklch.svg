<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="-65.85 -35.18 132 106"
	width="700" height="563"
	overflow="visible"
>
<desc>
OKLab 色空間の L 軸方向からの俯瞰を示す。
a98-rgb の原色と二次色が示され，それぞれには OKLCH L, C, H 値を与える凡例を伴う。
比較用に， sRGB の原色と二次色も示されている（破線）。
—
Show a top-down view of the OKLab color space.
The a98-rgb primaries and secondaries are shown,
with a legend giving the OKLCH L, C and H values.
For comparison, the sRGB primaries and secondaries are also shown (dashed lines).
</desc>

<style type="text/css"><![CDATA[
:root {
	color-scheme: light dark;
	background: Canvas;
	--grey: light-dark( grey, silver );
	font-family: monospace;
}

text {
	fill: CanvasText;
	stroke: none;
}

path {
	fill: none;
	stroke: CanvasText;
	stroke-width: 0.3;
}

.tic {
	stroke: var(--grey);
}
]]></style>

<defs>
<circle
	id="color-spot"
	r="1.3"
	stroke="CanvasText"
	stroke-width="0.3"
/>
</defs>

<!-- OKLab a,b values multiplied by 100 for convenient plotting,
     and b negated for a y-down coordinate system -->
<rect x="-65.85" y="-35.18" width="100%" height="100%" fill="Canvas"/>

<!-- axes -->
<path d="M0 -27.18 0 37.59"/>
<path d="M-40.71 0 36.89 0"/>

<!-- tic marks -->
<path class="tic" d="M-1.5,-20 h3 M-1.5,-10 h3 M-1.5,10 h3 M-1.5,20 h3 M-1.5,30 h3"/>
<path class="tic" d="M-40,-1.5 v3 M-30,-1.5 v3 M-20,-1.5 v3 M-10,-1.5 v3 M10,-1.5 v3 M20,-1.5 v3 M30,-1.5 v3"/>

<!-- sRGB primaries and secondaries -->
	<g opacity="0.5">
		<g stroke-dasharray="0.6 1.2">
<!-- radial lines for sRGB hue angle and chroma -->
<path d="M0,0 22.4863,-12.5846"/>
<path d="M0,0 -23.3888,-17.9498"/>
<path d="M0,0 -3.2457,31.1528"/>
<path d="M0,0 -14.9444,3.9398"/>
<path d="M0,0 27.4566,16.9156"/>
<path d="M0,0 -7.1369,-19.8570"/>
		</g>

<!-- sRGB primaries and secondaries -->
<use href="#color-spot" fill="red"
	transform="translate(22.4863, -12.5846)"/>
<use href="#color-spot" fill="green"
	transform="translate(-23.3888, -17.9498)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.2457, 31.1528)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-14.9444, 3.9398)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(27.4566, 16.9156)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.1369, -19.8570)"/>
	</g>

<!-- a98-rgb primaries and secondaries -->
<!-- the fill colors are sRGB, *not the a98-rgb colors* -->
	<g>
<!-- radial lines for a98-rgb hue angle and chroma -->
<path d="M0,0 25.1453,-14.0728"/>
<path d="M0,0 -34.7125,-18.7932"/>
<path d="M0,0 -3.2915,31.5924"/>
<path d="M0,0 -24.3425,5.8222"/>
<path d="M0,0 30.8879,14.1627"/>
<path d="M0,0 -7.6927,-21.1754"/>

<use href="#color-spot" fill="red"
	transform="translate(25.1453, -14.0728)"/>
<use href="#color-spot" fill="green"
	transform="translate(-34.7125, -18.7932)"/>
<use href="#color-spot" fill="blue"
	transform="translate(-3.2915, 31.5924)"/>
<use href="#color-spot" fill="cyan"
	transform="translate(-24.3425, 5.8222)"/>
<use href="#color-spot" fill="magenta"
	transform="translate(30.8879, 14.1627)"/>
<use href="#color-spot" fill="yellow"
	transform="translate(-7.6927, -21.1754)"/>
	</g>

<use href="#color-spot" fill="Canvas" />

	<g font-size="3.4pt">
<!-- haha not really 3.4pt but a unit is required per CSS -->
<text x="38.89" y="1">+a</text>
<text x="-42.71" y="1" text-anchor="end">-a</text>
<text x="2" y="42.59">-b</text>
<text x="2" y="-30.18">+b</text>
	</g>

	<g font-size="2.4pt">
		<g font-weight="bold">
<text x="-41.27" y="47.59">L</text>
<text x="-29.34" y="47.59">C</text>
<text x="-15.92" y="47.59">H</text>
<text x="22.59" y="47.59">L</text>
<text x="34.52" y="47.59">C</text>
<text x="47.94" y="47.59">H</text>
		</g>

<use href="#color-spot" fill="red"
	transform="translate(-58.77, 51.55)"/>
<text x="-54.69" y="52.39">red</text>
<text x="-41.27" y="52.39">70.22%</text>
<text x="-29.34" y="52.39">0.28815</text>
<text x="-15.92" y="52.39">29.23</text>
<use href="#color-spot" fill="cyan"
	transform="translate(5.09, 51.55)"/>
<text x="9.17" y="52.39">cyan</text>
<text x="22.59" y="52.39">86.00%</text>
<text x="34.52" y="52.39">0.25029</text>
<text x="47.94" y="52.39">193.45</text>
<use href="#color-spot" fill="green"
	transform="translate(-58.77, 56.35)"/>
<text x="-54.69" y="57.19">green</text>
<text x="-41.27" y="57.19">81.49%</text>
<text x="-29.34" y="57.19">0.39473</text>
<text x="-15.92" y="57.19">151.57</text>
<use href="#color-spot" fill="magenta"
	transform="translate(5.09, 56.35)"/>
<text x="9.17" y="57.19">magenta</text>
<text x="22.59" y="57.19">76.54%</text>
<text x="34.52" y="57.19">0.33980</text>
<text x="47.94" y="57.19">335.37</text>
<use href="#color-spot" fill="blue"
	transform="translate(-58.77, 61.15)"/>
<text x="-54.69" y="61.99">blue</text>
<text x="-41.27" y="61.99">45.84%</text>
<text x="-29.34" y="61.99">0.31763</text>
<text x="-15.92" y="61.99">264.05</text>
<use href="#color-spot" fill="yellow"
	transform="translate(5.09, 61.15)"/>
<text x="9.17" y="61.99">yellow</text>
<text x="22.59" y="61.99">96.66%</text>
<text x="34.52" y="61.99">0.22529</text>
<text x="47.94" y="61.99">109.97</text>
	</g>
</svg>
